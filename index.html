
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La meua primera web al núvol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2f8;
            text-align: center;
            padding: 60px 20px;
        }

        .contenidor {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #1769aa;
        }

        button {
            padding: 12px 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <h1>La meua primera web al núvol!</h1>
        <p>Aquesta pàgina està allotjada mitjançant
        GitHub Pages.</p>
        <p>Estic aprenent què és el Cloud Computing.</p>
        <button onclick="saludar()">Fes clic ací</button>
        <p id="missatge"></p>
    </div>

    <script>
        function saludar() {
            document.getElementById("missatge").innerText =
                "La meua web funciona correctament!";
        }
    </script>
</body>
</html>
